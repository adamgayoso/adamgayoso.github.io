name: Build and Deploy
on:
  push:
    branches:
      - dev
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    # build.py declares its own dependencies inline (PEP 723), so there is
    # nothing to install here. Notebook outputs come from the committed cache
    # in posts/_outputs -- CI never executes code cells.
    - name: Build
      run: uv run build.py

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./_build
        cname: adamgayoso.com
